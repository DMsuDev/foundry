name: "Publish Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        default: "v0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PROJECT_NAME: Foundry

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Validate the release tag format (must be strict SemVer)
  # ---------------------------------------------------------------------------
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate tag
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' is not a valid semantic version (vX.Y.Z)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 1: Package the header-only distribution archive
  # ---------------------------------------------------------------------------
  package:
    name: Package release archive
    needs: validate-tag
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set package name
        shell: bash
        run: echo "PACKAGE_NAME=${PROJECT_NAME}-${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Create staging directory
        shell: bash
        run: |
          mkdir -p dist/${PACKAGE_NAME}/cmake

          # Headers
          cp -r include/foundry dist/${PACKAGE_NAME}/include/

          # CMake integration files
          cp cmake/FoundryConfig.cmake.in   dist/${PACKAGE_NAME}/cmake/

          # Root files
          cp LICENSE README.md CHANGELOG.md dist/${PACKAGE_NAME}/

      - name: Archive
        shell: bash
        working-directory: dist
        run: tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}/"

      - name: Generate SHA256 checksum
        shell: bash
        working-directory: dist
        run: sha256sum "${PACKAGE_NAME}.tar.gz" > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Publish to GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
